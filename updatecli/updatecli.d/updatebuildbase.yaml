---
name: "Update build base version"

sources:
  # Read the current build base minor from the Dockerfile.
  # Driving from the current Dockerfile value means a manual forward
  # minor bump is preserved (we never drop below it).
  current_minor:
    name: Get current build base minor version from Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: GO_IMAGE
    transformers:
      # Value is "rancher/hardened-build-base:v1.24.9b1"
      # Trim prefix to get "v1.24.9b1"
      - trimprefix: "rancher/hardened-build-base:"
      # Trim 'v' prefix to get "1.24.9b1"
      - trimprefix: "v"
      # Capture the major.minor (group 1) to get "1.24"
      - findsubmatch:
          pattern: '^([0-9]+\.[0-9]+)'
          captureindex: 1

  # Get the latest upstream commit so the build-base check follows upstream
  # changes without relying on an upstream tag.
  latest_commit:
    name: Get latest upstream commit
    kind: gitcommit
    scmid: upstream
    spec:
      branch: master

  # Read the golang minor required by upstream's go.mod at that commit.
  upstream_minor:
    name: Get upstream golang minor from go.mod at the latest commit
    kind: file
    dependson:
      - latest_commit
    spec:
      file: 'https://raw.githubusercontent.com/{{ .scm.upstream.owner }}/{{ .scm.upstream.repository }}/{{ source "latest_commit" }}/go.mod'
      matchpattern: 'go ([0-9]+\.[0-9]+)'
    transformers:
      - trimprefix: 'go '

  # Floor minor = max(current Dockerfile minor, upstream go.mod minor).
  # - upstream ahead  -> follow upstream forward
  # - current ahead   -> preserve the manual forward bump
  # sort -V orders the two minors; tail -n1 takes the highest.
  floor_minor:
    name: Highest of the current and upstream golang minor
    kind: shell
    dependson:
      - current_minor
      - upstream_minor
    spec:
      command: 'printf "%s\n%s\n" "{{ source "current_minor" }}" "{{ source "upstream_minor" }}" | sort -V | tail -n1'

  # Find the latest build base release for the floor minor.
  latest_patch:
    name: Get latest build base patch for the floor minor
    kind: githubrelease
    dependson:
      - floor_minor
    spec:
      owner: rancher
      repository: image-build-base
      token: '{{ requiredEnv .github.token }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: regex/semver
        # 1. Convert 'v1.25.12b1' -> 'v1.25.12-b.1'
        #    Makes it a valid SemVer pre-release that sorts numerically
        replaceall:
          pattern: 'b(\d+)$'
          replacement: '-b.$1'
        # 2. Extract versions matching the floor minor (e.g. v1.25)
        regex: '(v{{ source "floor_minor" }}\.\d+.*)'
        # 3. Constraint '~1.25.0-0': >=1.25.0-0 <1.26.0
        #    The '-0' floor is required so SemVer evaluates pre-releases
        #    (every build-base tag is a '-b.N' pre-release).
        pattern: '~{{ source "floor_minor" }}.0-0'
        # Note: regex/semver remaps the result back to the original tag
        # (e.g. 'v1.25.12b1'), so no transformer is needed to undo the
        # '-b.' rewrite — the Dockerfile receives the original 'v...bN' form.

targets:
  dockerfile:
    name: "Bump to latest build base version in Dockerfile"
    kind: dockerfile
    scmid: default
    sourceid: latest_patch
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: "GO_IMAGE"
    transformers:
      - addprefix: "rancher/hardened-build-base:"

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ .scm.default.owner }}'
      repository: '{{ .scm.default.repository }}'
      branch: '{{ .scm.default.branch }}'
  upstream:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      owner: '{{ .scm.upstream.owner }}'
      repository: '{{ .scm.upstream.repository }}'
      branch: '{{ .scm.upstream.branch }}'

actions:
    default:
        title: 'Bump build base version to {{ source "latest_patch" }}'
        kind: github/pullrequest
        spec:
          merge:
            strategy: auto
          labels:
            - updatecli
        scmid: default

